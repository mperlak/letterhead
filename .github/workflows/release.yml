name: Release

# Tag a version (git tag v0.2.0 && git push origin v0.2.0) and this attaches
# letterhead.zip to a GitHub release: the skill folder, ready to upload in the
# Claude app (Settings → Capabilities → Skills).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror is in sync
        run: bash bin/sync-mounts.sh --check

      - name: Build letterhead.zip
        run: cd skills && zip -r -X ../letterhead.zip letterhead -x '*.DS_Store'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" letterhead.zip --title "letterhead $GITHUB_REF_NAME" --generate-notes
